name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is only buildable on the linux 22.04/24.04 images (ubuntu-latest is
        # 26.04 now) and on Intel macOS, so the cells are spelled out explicitly.
        include:
          - os: ubuntu-24.04
            python: "3.9"
          - os: ubuntu-24.04
            python: "3.13"
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.9"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install pyserial
        run: python -m pip install --upgrade pip pyserial
      - name: Run the test suite
        # Meraki's firmware image is not part of the repository, so the suite
        # falls back to a synthetic image of the same size (1134 packets).
        # pty-based tests skip themselves on Windows; macOS and Linux run them.
        # tests/run.py arms a faulthandler watchdog, so a stall prints stacks.
        timeout-minutes: 10
        env:
          PYTHONUNBUFFERED: "1"
        run: python -u -m tests.run

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip ruff
      - run: ruff check .
